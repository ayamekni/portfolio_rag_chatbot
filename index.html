<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Album Header - The Haunting of Hill House</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="album-hero" id="album-hero">
    <div class="album-hero__backdrop" aria-hidden="true"></div>
    <div class="album-hero__content">
      <img class="album-art" id="album-art" alt="Album cover" src=""/>

      <div class="album-meta">
        <div class="eyebrow">Album</div>
        <h1 class="title" id="album-title">Album Title</h1>
        <div class="subtitle" id="album-subtitle">Subtitle</div>

        <div class="album-stats" id="album-stats">
          <!-- Populated by JS -->
        </div>
      </div>
    </div>
    <div class="album-hero__fade" aria-hidden="true"></div>
  </header>

  <main class="page">
    <section class="placeholder">
      <p>This is a static reproduction of the album header UI shown in the reference screenshot. Resize the window to see responsive behavior.</p>
    </section>
  </main>

  <script src="./main.js" defer></script>
</body>
</html>
